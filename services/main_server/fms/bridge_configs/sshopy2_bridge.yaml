name: sshopy2_bridge
from_domain: 12
to_domain: 99

topics:
  # ── Robot → Server (domain 12 → 99) ──
  /odom:
    type: nav_msgs/msg/Odometry
    remap: /sshopy2/odom

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: /sshopy2/amcl_pose
    qos:
      reliability: reliable
      durability: transient_local

  /battery/percent:
    type: std_msgs/msg/Float32
    remap: /sshopy2/battery/percent

  /navigate_to_pose/_action/status:
    type: action_msgs/msg/GoalStatusArray
    remap: /sshopy2/navigate_to_pose/_action/status

  /scan:
    type: sensor_msgs/msg/LaserScan
    remap: /sshopy2/scan
    qos:
      reliability: best_effort

  # Server → Robot は sshopy2_to_robot.yaml で別途ブリッジ
