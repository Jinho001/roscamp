name: sshopy1_bridge
from_domain: 11
to_domain: 99

topics:
  # ── Robot → Server (domain 11 → 99) ──
  /odom:
    type: nav_msgs/msg/Odometry
    remap: /sshopy1/odom

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: /sshopy1/amcl_pose
    qos:
      reliability: reliable
      durability: transient_local

  /battery/percent:
    type: std_msgs/msg/Float32
    remap: /sshopy1/battery/percent

  /navigate_to_pose/_action/status:
    type: action_msgs/msg/GoalStatusArray
    remap: /sshopy1/navigate_to_pose/_action/status

  /scan:
    type: sensor_msgs/msg/LaserScan
    remap: /sshopy1/scan
    qos:
      reliability: best_effort

  # Server → Robot は sshopy1_to_robot.yaml で別途ブリッジ
