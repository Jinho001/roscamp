name: ware_jet_bridge
from_domain: 15
to_domain: 99

topics:
  # ── Robot → Server (domain 15 → 99) ──
  /warejet/joint_states:
    type: sensor_msgs/msg/JointState
    remap: /ware_jet/joint_states

  /work_complete:
    type: std_msgs/msg/String
    remap: /ware_jet/work_complete

  # ── Server → Robot (domain 99 → 15, reversed) ──
  /ware_jet/trigger_work:
    type: std_msgs/msg/String
    remap: /trigger_work
    reversed: true
