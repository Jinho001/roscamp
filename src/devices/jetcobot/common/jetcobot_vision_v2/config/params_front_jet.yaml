# params_front_jet.yaml
# FrontJet (회수존) Pick/Place 파이프라인 파라미터
# vision_params_front_jet.yaml + pick_place_profiles.yaml 통합본
#
# observe_pose: TCP 좌표 [x mm, y mm, z mm, rx deg, ry deg, rz deg]
# MotionController가 TCP 기준으로 이동하고,
# get_flange_coords()로 flange 좌표를 읽어 CoordTransformer.update_pose()에 전달.

coord_transform:
  # T_ee2cam (row-major 4×4) — Hand-Eye 캘리브 결과 (set_end_type=0, flange 기준)
  handeye_matrix:
    - 0.9999456694681534
    - -0.007015041752104461
    - 0.007710207591392989
    - 0.00397572785661528
    - 0.007410287985286183
    - 0.9985939674983642
    - -0.052489767649047024
    - -0.06134913400345819
    - -0.007331148877308805
    - 0.052544050710732725
    - 0.9985916968366233
    - 0.022436974891112085
    - 0.0
    - 0.0
    - 0.0
    - 1.0
  # [fx, fy, cx, cy] — RMS 0.2571 px (2026-05-12 캘리브)
  camera_intrinsics:
    - 990.8120239698858
    - 987.6160053978392
    - 301.19713298628164
    - 238.38042557352367

motion:
  port: "/dev/ttyJETCOBOT"
  baud: 1000000
  # flange→TCP 오프셋 [x, y, z] mm
  # 하드웨어 set_tool_reference로 주입됨
  tcp_offset: [0.0, -20.0, 110.0]

detector:
  server_url: "http://192.168.1.4:8081"
  detect_timeout_sec: 10.0

profiles:
  receiving_zone:
    # 관측 자세 (TCP 좌표 기준, 2026-05-30 실측)
    observe_pose: [-58.5, -181.6, 154.5, 178.23, 0.94, -179.5]
    # base_link 기준 상자 상단면 Z 높이 (mm) — 그리퍼 터치 기준 flange_z - tcp_offset_z
    z_surface_mm: 25.5
    # 비전 결과에 추가할 보정 오프셋 [x, y, z] mm
    pick_offset_mm: [0.0, 16.3, -10.0]
    # 파지 자세
    grasp_roll: 180.0
    grasp_pitch: 0.0
    grasp_yaw_offset: -179.0
    # approach 높이 여유 (mm)
    approach_z_offset_mm: 20.0

  tray:
    # 핑키 적재함 — 상자 픽업
    observe_pose: [-62.4, -87.9, 314.2, -161.81, 0.94, -179.37]
    z_surface_mm: 90.0
    pick_offset_mm: [0.0, 0.0, 0.0]
    grasp_roll: -178.81
    grasp_pitch: 0.94
    grasp_yaw_offset: 0.0
    approach_z_offset_mm: 20.0

  pinky_tray_place:
    # 핑키 트레이 — 상자 적재
    observe_pose: [-62.4, -87.9, 314.2, -161.81, 0.94, -179.37]
    z_surface_mm: 70.0          # TODO: 실측 후 입력
    pick_offset_mm: [10.0, -10.0, 15.0]
    grasp_roll: -178.81
    grasp_pitch: 0.94
    grasp_yaw_offset: 0.0
    approach_z_offset_mm: 20.0
