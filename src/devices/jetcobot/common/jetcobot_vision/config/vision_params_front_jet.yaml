# vision_params_front_jet.yaml
# FrontJet Pi 전용 파라미터
# ※ AI 서버(192.168.1.121) cv_detect_server: --udp-port 5000 --port 8081
# ※ stream_sender: --host 192.168.1.121 --port 5000

coord_transform_node:
  ros__parameters:
    # handeye_result.yaml T_ee2cam (row-major 4×4)
    handeye_matrix:
      - 0.9999456694681534
      - -0.007015041752104461
      - 0.007710207591392989
      - 0.00397572785661528
      - 0.007410287985286183
      - 0.9985939674983642
      - -0.052489767649047024
      - -0.06134913400345819
      - -0.007331148877308805
      - 0.052544050710732725
      - 0.9985916968366233
      - 0.022436974891112085
      - 0.0
      - 0.0
      - 0.0
      - 1.0
    # camera_info.yaml [fx, fy, cx, cy]
    camera_intrinsics:
      - 990.8120239698858
      - 987.6160053978392
      - 301.19713298628164
      - 238.38042557352367
    observe_pose:
      - -58.5
      - -181.6
      - 154.5
      - 178.23
      - 0.94
      - -179.5
    z_surface_mm: 20.0
    obb_topic:    "/detect_bridge_node/obb_boxes"

vision_pick_place_node:
  ros__parameters:
    port:                  "/dev/ttyJETCOBOT"
    baud:                  1000000
    grasp_roll:            -178.81
    grasp_pitch:           0.94
    grasp_yaw_offset:      0.0
    tcp_offset:
      - 0.0
      - -20.0
      - 110.0
    pick_z_offset_mm:      20.0
    detect_timeout_sec:    10.0
    coord_topic:           "/coord_transform_node/pick_point"
    coord_enable_service:  "/coord_transform_node/enable"
    cv_detect_server_url:  "http://192.168.1.4:8081"

retrieval_watcher_node:
  ros__parameters:
    obb_topic:           "/detect_bridge_node/obb_boxes"
    confirm_secs:        3.0
    slot_x_start:         98.0    # 슬롯 0 좌측 cx (1번 칸 실측)
    slot_x_end:          550.0   # 슬롯 3 우측 cx (4번 칸 실측)
    slot_x_boundaries:  [211.0, 324.0, 437.0]  # 열 경계 cx
    slot_cy_mid:         234.0   # 상단/하단 구분선 cy ((388+80)/2)
    fms_url:            "http://192.168.1.130:8002"
