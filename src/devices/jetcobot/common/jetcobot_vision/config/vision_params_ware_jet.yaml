# vision_params_ware_jet.yaml
# WareJet Pi 전용 파라미터
# ※ 캘리브레이션 값(handeye, camera_intrinsics, observe_pose)은 실측 후 업데이트 필요
# ※ AI 서버(192.168.1.121) cv_detect_server: --udp-port 5001 --port 8082
# ※ stream_sender: --host 192.168.1.121 --port 5001

coord_transform_node:
  ros__parameters:
    # TODO: WareJet 핸드아이 캘리브레이션 값으로 교체
    handeye_matrix:
      - 0.9999456694681534
      - -0.007015041752104461
      - 0.007710207591392989
      - 0.00397572785661528
      - 0.007410287985286183
      - 0.9985939674983642
      - -0.052489767649047024
      - -0.06134913400345819
      - -0.007331148877308805
      - 0.052544050710732725
      - 0.9985916968366233
      - 0.022436974891112085
      - 0.0
      - 0.0
      - 0.0
      - 1.0
    # TODO: WareJet 카메라 내부 파라미터로 교체
    camera_intrinsics:
      - 990.8120239698858
      - 987.6160053978392
      - 301.19713298628164
      - 238.38042557352367
    # TODO: WareJet observe_pose 실측 후 업데이트
    observe_pose:
      - -62.4
      - -87.9
      - 314.2
      - -161.81
      - 0.94
      - -179.37
    z_surface_mm: 95.0
    obb_topic:    "/detect_bridge_node/obb_boxes"

vision_pick_place_node:
  ros__parameters:
    port:                  "/dev/ttyJETCOBOT"
    baud:                  1000000
    grasp_roll:            -178.81
    grasp_pitch:           0.94
    grasp_yaw_offset:      0.0
    tcp_offset:
      - 0.0
      - 20.0
      - 100.0
    pick_z_offset_mm:      20.0
    detect_timeout_sec:    10.0
    coord_topic:           "/coord_transform_node/pick_point"
    coord_enable_service:  "/coord_transform_node/enable"
    cv_detect_server_url:  "http://192.168.1.121:8082"
